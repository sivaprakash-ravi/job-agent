name: Daily Job Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

jobs:
  test-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Collect jobs
        run: python jobs/collect_jobs.py

      - name: Upload job report
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-report
          path: reports/jobs.json
