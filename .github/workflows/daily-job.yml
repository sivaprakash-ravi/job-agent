name: Daily Job Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  test-automation:
    runs-on: ubuntu-latest

    env:
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      JOB_ALERT_EMAIL: ${{ secrets.JOB_ALERT_EMAIL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      INDEED_API_KEY: ${{ secrets.INDEED_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install JobSpy
        run: pip install python-jobspy

      - name: Collect Indeed jobs
        run: python jobs/collect_indeed.py

      - name: Collect jobs
        run: python jobs/collect_jobs.py

      - name: Send email alert
        if: ${{ env.GMAIL_APP_PASSWORD != '' }}
        run: python jobs/send_email.py

      - name: Send Telegram alert
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: python jobs/send_telegram.py

      - name: Save duplicate history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sent_jobs.json
          git diff --cached --quiet || git commit -m "Update job duplicate history"
          git push

      - name: Upload job report
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-report
          path: reports/
